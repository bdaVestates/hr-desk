<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vestates HR Desk</title>
<meta name="theme-color" content="#0b0b0b">
<meta name="description" content="Group HR records and dashboard.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HR Desk">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a working HR desk - plain, exact, built for a weekly check-in.
   IDEA: the group's staff register turned into a live control sheet.
   PICTURE: the mint headline field with the headcount number beside the company bars.
   COLOUR and TYPE: black and white plus one mint field; Space Grotesk numbers, Inter text.
   LAYOUT: header, filter row, tabs; each tab = finding, figures, then tables and lists to act on. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0d0d0d);--ink:light-dark(#0b0b0b,#f1f1ef);--muted:light-dark(#5f6368,#a3a3a0);--line:light-dark(#e6e6e2,#2a2a28);--soft:light-dark(#f6f6f3,#171716);--mint:light-dark(#b8f5d0,#123326);--mintink:light-dark(#0b0b0b,#b8f5d0);
--ft:#2a78d6;--ct:#eb6834;--male:#6250d6;--fem:#e87ba4;--crit:#d03b3b;--ser:#ec835a;--warn:#eda100;--good:#0ca30c;--gray:#9ca3af;--chk:#6250d6}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.num{font-family:"Space Grotesk",Inter,sans-serif}
h1{font-size:clamp(26px,3.4vw,40px);line-height:1.05;margin:0;text-wrap:balance}
h2{font-size:22px;margin:0 0 4px}h3{font-size:16px;margin:0 0 10px}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(3vw,16px)}
header{border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:14px}
.brand{font:700 18px "Space Grotesk",sans-serif}.brand small{font:400 13px Inter;color:var(--muted);margin-left:8px}
.btn{font:600 14px Inter;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:focus-visible,select:focus-visible,input:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:3px solid #2a78d6;outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-block:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 14px Inter;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label.set{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
input,select{font:16px Inter;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=number]{width:76px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{flex:none;font:600 15px Inter;padding:12px 14px;min-height:44px;border:0;background:none;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);border-bottom:1px solid var(--line)}
.field{background:var(--mint);color:var(--mintink);padding:clamp(22px,3vw,40px) max(3vw,16px)}
.big{font:700 clamp(64px,9vw,112px)/1 "Space Grotesk",sans-serif;letter-spacing:-.02em}
.field p{margin:8px 0 0;font-size:16px;max-width:42ch}
.heroR{padding:clamp(22px,3vw,40px) max(3vw,16px)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.kpi{background:var(--bg);padding:16px max(1.5vw,14px)}
.kpi .l{font-size:13px;color:var(--muted)}.kpi .v{font:700 30px/1.15 "Space Grotesk",sans-serif;white-space:nowrap}.kpi .s{font-size:13px;color:var(--muted)}
.kpi.alert .v{color:var(--crit)}
section.band{padding:28px 0;border-bottom:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.lede{color:var(--muted);margin:0 0 16px;font-size:15px}
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:120px minmax(0,1fr) 48px;gap:10px;align-items:center;font-size:14px}
.track{display:flex;height:22px;gap:2px}.seg{height:100%;border-radius:2px;position:relative}
.seg:first-child{border-radius:4px 2px 2px 4px}.seg:last-child{border-radius:2px 4px 4px 2px}.seg:only-child{border-radius:4px}
.row .t{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-bottom:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;text-align:left;color:var(--muted);font-size:13px;padding:8px 10px;border-bottom:1px solid var(--ink)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:700;border-top:1px solid var(--ink);border-bottom:0}
tr.sel td{background:var(--soft)}
tbody tr.click{cursor:pointer}tbody tr.click:hover td{background:var(--soft)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.p-crit{color:var(--crit)}.p-ser{color:#c2552b}.p-warn{color:#a86f00}.p-good{color:#0a7f0a}.p-gray{color:var(--muted)}.p-chk{color:var(--chk)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}
.drop{max-width:720px;margin:48px auto;padding:clamp(24px,4vw,48px);border:2px dashed var(--line);border-radius:18px;text-align:center}
.drop.over{border-color:var(--ink);background:var(--soft)}
.drop p{color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.toolbar input[type=search]{flex:1 1 260px;max-width:420px}
.issue{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);padding:0;width:min(560px,94vw)}
dialog::backdrop{background:rgb(0 0 0/.45)}
.dlg{padding:22px}.dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;font-size:14px;margin:14px 0}.dl dt{color:var(--muted)}.dl dd{margin:0}
.pend{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--ink);color:var(--bg);box-shadow:0 -6px 20px rgb(0 0 0/.18)}
.pend .wrap{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-block:10px}
.pend .btn{background:var(--mint);color:#0b0b0b;border-color:var(--mint)}.pend .btn.ghost{background:transparent;color:var(--bg);border-color:rgb(255 255 255/.35)}
:root[data-theme=dark] .pend .btn.ghost,.pend .btn.ghost{color:inherit}
body.haspend{padding-bottom:84px}
.acts2{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
form.ef{display:grid;gap:18px}
form.ef fieldset{border:0;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
form.ef legend{font:700 15px "Space Grotesk",sans-serif;padding:0;margin-bottom:8px}
form.ef label{display:grid;gap:4px;align-content:start;font-size:13px;color:var(--muted)}
form.ef input,form.ef select{width:100%;height:44px;color:var(--ink)}
form.ef .hint{font-size:12px;color:var(--muted)}
.ferr{color:var(--crit);font-size:14px;min-height:1em}
dialog.wide{width:min(760px,96vw)}
.dlgfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--bg);padding-top:12px}
.edited{display:inline-block;font-size:11px;font-weight:600;color:#a86f00;margin-left:6px}
.toast{position:fixed;z-index:9;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.scroll{overflow-x:auto}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:820px){.hero,.grid2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){table{font-size:13px}.row{grid-template-columns:92px minmax(0,1fr) 40px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--muted)}.stack td:empty{display:none}.stack tr.tot{border-top:1px solid var(--ink)}.dl{grid-template-columns:minmax(0,1fr)}}

.who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.who b{color:var(--ink)}
#authBox .drop p,#setupBox .drop p,#noAccess .drop p{color:var(--muted)}
#authBox form.ef{margin-top:18px}#authBox form.ef label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
#authBox input{width:100%;height:44px}
form.ef select[data-role],td select{min-height:36px}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header>
  <div class="wrap top">
    <div class="brand">Vestates HR Desk<small id="srcLbl"></small></div>
    <div class="who"><span id="who" class="who" hidden></span><button class="btn ghost" id="installBtn" hidden>Install app</button></div>
  </div>
</header>
<input type="file" id="importFile" accept=".xlsx,.xlsm,.xls" hidden>
<main id="start" hidden></main>
<main id="authBox" class="wrap" hidden></main>
<main id="setupBox" class="wrap" hidden></main>
<main id="noAccess" class="wrap" hidden></main>
<div id="app" hidden>
  <div class="wrap bar">
    <div class="chips" id="chips" role="group" aria-label="Company filter"></div>
    <label class="set">Probation <input type="number" id="prob" min="1" max="24" value="6"> months</label>
    <label class="set">As at <input type="date" id="asof"></label>
  </div>
  <div class="wrap"><nav class="tabs" role="tablist" id="tabs"></nav></div>
  <div id="view"></div>
</div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const COMPANIES=['365 Energy','Apex Restaurant','Vestates','Zbom Home','Farm2Table','Other / Unmapped'];
const TABS=[['overview','Overview'],['salary','Salary cost'],['exits','Exits'],['contracts','Contracts & probation'],['people','People'],['quality','Data checks']];
const STATUS=[['Expired','crit','--crit'],['Due ≤30 days','ser','--ser'],['Due 31–90 days','warn','--warn'],['Running >90 days','good','--good'],['No end date','gray','--gray'],['Check date','chk','--chk']];
const PCLS={'On probation':'good','Ending ≤30 days':'ser','Ended ≤30 days ago':'crit','Completed':'gray'};
const S={recs:[],company:'All',prob:6,asof:null,tab:'overview',q:''};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('en-NG');
const fmt=n=>n?nf.format(Math.round(n)):'–';
const ngn=n=>n?'₦'+nf.format(Math.round(n)):'–';
const ngnM=n=>n>=1e6?'₦'+(n/1e6).toFixed(2)+'m':ngn(n);
const pct=(a,b)=>b?(100*a/b).toFixed(1)+'%':'–';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dstr=d=>d?String(d.getUTCDate()).padStart(2,'0')+'-'+MON[d.getUTCMonth()]+'-'+d.getUTCFullYear():'';
const utc=(y,m,d)=>new Date(Date.UTC(y,m,d));
const days=(a,b)=>Math.round((a-b)/864e5);
const addMonths=(d,n)=>{const y=d.getUTCFullYear(),m=d.getUTCMonth()+n,last=new Date(Date.UTC(y,m+1,0)).getUTCDate();return utc(y,m,Math.min(d.getUTCDate(),last))};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2600)}


/* ---------- parsing ---------- */
function toDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date&&!isNaN(v))return utc(v.getFullYear(),v.getMonth(),v.getDate()+(v.getHours()>=12?1:0));
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+v*864e5);return utc(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())}
  const s=String(v).replace(/ /g,' ').trim();if(!s)return null;
  let m=s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[A-Za-z]*[-\/ ](\d{2,4})$/);
  if(m){const mi=MON.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());let y=+m[3];if(y<100)y+=2000;if(mi>=0)return utc(y,mi,+m[1])}
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m)return utc(+m[3],+m[2]-1,+m[1]);
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return utc(+m[1],+m[2]-1,+m[3]);
  return 'bad';
}
const txt=v=>v==null?'':String(v).replace(/ /g,' ').replace(/\s+/g,' ').trim();
function group(c){const u=c.toUpperCase();if(!u)return '';if(u.startsWith('365'))return '365 Energy';if(u.startsWith('APEX'))return 'Apex Restaurant';if(u.startsWith('VEST'))return 'Vestates';if(u.startsWith('ZBOM'))return 'Zbom Home';if(u.startsWith('FARM'))return 'Farm2Table';return 'Other / Unmapped'}
function parseRows(rows,rowStart){
  rowStart=rowStart||0;
  let h=-1;
  for(let i=0;i<Math.min(rows.length,40);i++){const r=(rows[i]||[]).map(x=>txt(x).toLowerCase());if(r.includes('company')&&(r.includes('fullname')||r.includes('full name')||r.includes('job status'))){h=i;break}}
  if(h<0)throw new Error('Could not find the header row (a row with "Company" and "FullName"). Is this the employee database?');
  const hdr=rows[h].map(x=>txt(x).toLowerCase());
  const col=(...names)=>{for(const n of names){const i=hdr.indexOf(n);if(i>=0)return i}return -1};
  const C={co:col('company'),fn:col('fullname','full name'),first:col('first name'),middle:col('middle name'),sur:col('surname'),phone:col('official phone number'),renew:col('renewal status'),annual:col('annual gross salary'),hire:col('hiring date','hire date'),exp:col('contract expiry date'),dept:col('department'),js:col('job status'),title:col('job title'),gen:col('gender'),sal:col('monthly gross salary'),exit:col('exit date'),why:col('exit reason'),rev:col('revised contract date'),office:col('office'),mgr:col('reporting managers'),email:col('official emails')};
  const g=(r,i)=>i<0?null:r[i];
  const out=[];
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]||[];const co=txt(g(r,C.co));if(!co)continue;
    let name=txt(g(r,C.fn));if(!name)name=[txt(g(r,C.first)),txt(g(r,C.sur))].filter(Boolean).join(' ');
    const rawHire=g(r,C.hire),rawExp=g(r,C.exp);
    const salV=g(r,C.sal);const sal=typeof salV==='number'?salV:(parseFloat(String(salV??'').replace(/[^\d.]/g,''))||0);
    out.push({row:rowStart+i+1,first:txt(g(r,C.first)),middle:txt(g(r,C.middle)),sur:txt(g(r,C.sur)),phone:txt(g(r,C.phone)),renew:txt(g(r,C.renew)),co,group:group(co),name:name||'(no name)',hire:toDate(rawHire),exp:toDate(rawExp),rev:toDate(g(r,C.rev)),exit:toDate(g(r,C.exit)),why:txt(g(r,C.why)),
      dept:txt(g(r,C.dept)),type:txt(g(r,C.js)),title:txt(g(r,C.title)),gender:txt(g(r,C.gen)),sal,office:txt(g(r,C.office)),mgr:txt(g(r,C.mgr)),email:txt(g(r,C.email)),
      textDate:(typeof rawHire==='string'&&rawHire.trim()!=='')||(typeof rawExp==='string'&&rawExp.trim()!=='')});
  }
  if(!out.length)throw new Error('The sheet has a header row but no employee rows.');
  out.C=C;out.hdrRow=rowStart+h+1;
  return out;
}
function loadBuffer(buf,name){
  if(typeof XLSX==='undefined')throw new Error('The spreadsheet reader did not load. Check your internet connection and reload.');
  const wb=XLSX.read(buf,{type:'array',cellDates:true});
  const order=[...wb.SheetNames].sort((a,b)=>(b.toLowerCase()==='database')-(a.toLowerCase()==='database'));
  let err;
  for(const sn of order){try{const ws=wb.Sheets[sn];const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:true});const st=ws['!ref']?XLSX.utils.decode_range(ws['!ref']).s.r:0;const recs=parseRows(rows,st);return {recs,sheet:sn,C:recs.C,hdrRow:recs.hdrRow}}catch(e){err=e}}
  throw err||new Error('No usable sheet found.');
}


/* ---------- calculations (same rules as the Excel DashBoard) ---------- */
function compute(){
  const T=S.asof,y=T.getUTCFullYear();
  for(const r of S.recs){
    const ex=r.exit instanceof Date?r.exit:null,hire=r.hire instanceof Date?r.hire:null;
    r.exited=!!(ex&&ex<=T);r.active=!r.exited;r.exitYTD=r.exited&&ex.getUTCFullYear()===y;r.exitD=ex;r.hireD=hire;
    const end=r.rev instanceof Date?r.rev:(r.exp instanceof Date?r.exp:null);r.end=end;
    r.cStatus='';r.cDays=null;
    if(r.active&&r.type.toLowerCase()==='contract'){
      if(!end)r.cStatus='No end date';
      else{r.cDays=days(end,T);
        if(hire&&end<=hire)r.cStatus='Check date';else if(end<T)r.cStatus='Expired';else if(r.cDays<=30)r.cStatus='Due ≤30 days';else if(r.cDays<=90)r.cStatus='Due 31–90 days';else r.cStatus='Running >90 days'}
    }
    r.probEnd=r.active&&hire?addMonths(hire,S.prob):null;r.pDays=r.probEnd?days(r.probEnd,T):null;
    r.pStatus=!r.probEnd?'':r.pDays>30?'On probation':r.pDays>=0?'Ending ≤30 days':r.pDays>=-30?'Ended ≤30 days ago':'Completed';
  }
}
const inF=r=>S.company==='All'||r.group===S.company;
const byCo=fn=>{const o=COMPANIES.map(c=>({c,...fn(S.recs.filter(r=>r.group===c),c)}));return o.filter(x=>x.c!=='Other / Unmapped'||Object.values(x).some(v=>typeof v==='number'&&v))};
const cnt=(a,f)=>a.filter(f).length;
const isFT=r=>r.type.toLowerCase()==='full time',isCT=r=>r.type.toLowerCase()==='contract';
const g=v=>v.toLowerCase();

/* ---------- small renderers ---------- */
function stackRows(data,keys,colors){
  const max=Math.max(1,...data.map(d=>keys.reduce((s,k)=>s+d[k],0)));
  return '<div class="rows">'+data.map(d=>{const t=keys.reduce((s,k)=>s+d[k],0);
    return `<div class="row"><span>${esc(d.c)}</span><div class="track">${keys.map((k,i)=>d[k]?`<div class="seg" title="${esc(k)}: ${d[k]}" style="width:${100*d[k]/max}%;background:var(${colors[i]})"></div>`:'').join('')}</div><span class="t">${fmt(t)}</span></div>`}).join('')+'</div>';
}
const legend=(names,colors)=>'<div class="legend">'+names.map((n,i)=>`<span><i style="background:var(${colors[i]})"></i>${esc(n)}</span>`).join('')+'</div>';

function issues(){
  const out=[];
  for(const r of S.recs){
    if(r.cStatus==='Check date')out.push([r,'Contract end date is on or before the hire date']);
    if(r.cStatus==='No end date')out.push([r,'Contract staff with no Contract Expiry Date']);
    if(r.hire==='bad'||r.exp==='bad'||r.exit==='bad')out.push([r,'A date could not be read']);
    else if(r.textDate)out.push([r,'Date typed as text (works here, but retype it as a real date in Excel)']);
    if(!r.hire)out.push([r,'No Hiring Date']);
    if(r.active&&!['male','female'].includes(g(r.gender)))out.push([r,'Gender not stated']);
    if(r.active&&!isFT(r)&&!isCT(r))out.push([r,'Job Status is not Full Time or Contract']);
    if(r.group==='Other / Unmapped')out.push([r,`Company “${r.co}” does not match a known company`]);
    if(r.hireD&&r.hireD>S.asof)out.push([r,'Hiring Date is in the future']);
  }
  return out.filter(([r])=>inF(r));
}

/* ---------- Firebase ---------- */
const CFG = window.HRDESK_FIREBASE || null;
let db = null, auth = null;
const ROLE_LABEL = { admin: 'Admin', editor: 'Editor', viewer: 'Viewer' };
const U = { user: null, role: null, name: '' };
const D = { emps: new Map(), pay: new Map(), stats: null, unsubs: [] };
const isAdmin = () => U.role === 'admin', canEdit = () => U.role === 'admin' || U.role === 'editor';
const iso = d => d instanceof Date ? d.toISOString().slice(0, 10) : null;
const fromIso = s => s ? new Date(s + 'T00:00:00Z') : null;
const ts = () => firebase.firestore.FieldValue.serverTimestamp();
const lower = e => String(e || '').trim().toLowerCase();

// Firestore document <-> app record
const DOC_FIELDS = { co: 'company', name: 'fullName', first: 'firstName', middle: 'middleName', sur: 'surname', type: 'jobStatus', dept: 'department', title: 'jobTitle', office: 'office', mgr: 'reportingManager', gender: 'gender', email: 'officialEmail', phone: 'officialPhone', renew: 'renewalStatus', why: 'exitReason' };
const DOC_DATES = { hire: 'hiringDate', exp: 'contractExpiry', rev: 'revisedContractDate', exit: 'exitDate' };
function toRec(id, d) {
  const r = { row: id, excelRow: d.excelRow || null, textDate: false };
  for (const [k, f] of Object.entries(DOC_FIELDS)) r[k] = d[f] || '';
  for (const [k, f] of Object.entries(DOC_DATES)) r[k] = fromIso(d[f]);
  r.group = group(r.co); if (!r.name) r.name = [r.first, r.middle, r.sur].filter(Boolean).join(' ') || '(no name)';
  r.sal = isAdmin() ? (D.pay.get(id) || 0) : 0;
  r.updatedAt = d.updatedAt && d.updatedAt.toDate ? d.updatedAt.toDate() : null; r.updatedByEmail = d.updatedByEmail || '';
  return r;
}
function toDoc(r) {
  const d = {};
  for (const [k, f] of Object.entries(DOC_FIELDS)) d[f] = r[k] || '';
  for (const [k, f] of Object.entries(DOC_DATES)) d[f] = iso(r[k]);
  if (r.excelRow) d.excelRow = r.excelRow;
  return d;
}
function rebuild() {
  S.recs = [...D.emps.entries()].map(([id, d]) => toRec(id, d));
  if (U.role) render();
}

/* ---------- salary totals (admins see people, others see company totals) ---------- */
function payCo(c) {
  if (isAdmin()) { const x = S.recs.filter(r => r.active && r.group === c); return { m: x.reduce((s, r) => s + r.sal, 0), f: cnt(x, r => r.sal > 0) } }
  const b = D.stats && D.stats.byCompany && D.stats.byCompany[c]; return { m: b ? b.m : 0, f: b ? b.f : 0 };
}
function payTot() { let m = 0, f = 0; for (const c of COMPANIES) if (S.company === 'All' || S.company === c) { const p = payCo(c); m += p.m; f += p.f } return { m, f } }
async function refreshStats() {
  if (!isAdmin() || !S.recs.length) return;
  compute();
  const byCompany = {}; for (const c of COMPANIES) { const x = S.recs.filter(r => r.active && r.group === c); const m = x.reduce((s, r) => s + r.sal, 0), f = cnt(x, r => r.sal > 0); if (m || f) byCompany[c] = { m, f } }
  const cur = D.stats && JSON.stringify(D.stats.byCompany || {});
  if (cur === JSON.stringify(byCompany)) return;
  try { await db.doc('stats/pay').set({ byCompany, updatedAt: ts(), asOf: iso(S.asof) }) } catch (e) { console.warn(e) }
}

const sameVal = (a, b) => { if (a instanceof Date || b instanceof Date) return a instanceof Date && b instanceof Date && +a === +b; return (a ?? '') === (b ?? '') || (typeof a === 'number' && a === +b) };

  const ws = XLSX.utils.json_to_sheet(rows, { cellDates: true, dateNF: 'dd-mmm-yyyy' });
  ws['!cols'] = Object.keys(rows[0] || {}).map(k => ({ wch: Math.max(12, k.length + 2) }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Database');
  XLSX.writeFile(wb, `HR_Desk_export_${iso(S.asof)}.xlsx`, { cellDates: true });
  toast('Downloaded the Excel export');
}

/* ---------- render & events ---------- */
const BASE_TABS = TABS.slice();
function allowedTab(k) { return ['users', 'activity'].includes(k) ? isAdmin() : true }
function tabsFor() { return [...BASE_TABS, ['data', 'Import / export'], ...(isAdmin() ? [['users', 'Access'], ['activity', 'Activity']] : [])] }
let renderSeq = 0;
async function render() {
  if (!U.role) return;
  compute();
  $('#chips').innerHTML = ['All', ...COMPANIES.filter(c => S.recs.some(r => r.group === c))].map(c => `<button class="chip" data-co="${esc(c)}" aria-pressed="${S.company === c}">${c === 'All' ? 'All companies' : esc(c)}</button>`).join('');
  $('#tabs').innerHTML = tabsFor().map(([k, l]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${l}${k === 'quality' && S.recs.length ? ` (${issues().length})` : ''}</button>`).join('');
  $('#srcLbl').textContent = S.recs.length + ' staff records · live';
  const seq = ++renderSeq;
  if (!S.recs.length && !['data', 'users', 'activity'].includes(S.tab)) {
    $('#view').innerHTML = `<div class="wrap"><div class="drop" style="border-style:solid"><h1 style="font-size:28px">No staff records yet</h1><p>${isAdmin() ? 'Import the employee database Excel file to load your current staff, or add people one by one.' : 'An admin needs to import the staff records first.'}</p><div class="acts">${isAdmin() ? '<button class="btn" data-act="import">Import from Excel</button>' : ''}${canEdit() ? '<button class="btn ghost" data-act="add">Add employee</button>' : ''}</div></div></div>`;
    return;
  }
  try {
    const html = await VIEWS[S.tab]();
    if (seq === renderSeq) {
      const sx = window.scrollX, sy = window.scrollY, active = document.activeElement && document.activeElement.id;
      $('#view').innerHTML = html; window.scrollTo(sx, sy);
      if (active === 'search') { const s = $('#search'); s.focus(); try { s.setSelectionRange(s.value.length, s.value.length) } catch (_) { } }
    }
  } catch (e) { console.error(e); $('#view').innerHTML = `<div class="wrap"><div class="empty">Something went wrong drawing this view: ${esc(e.message)}</div></div>` }
}
Object.assign(VIEWS, { data: vData, users: vUsers, activity: vActivity });

function detail(id) {
  const r = S.recs.find(x => x.row === id); if (!r) { $('#dlg').open && $('#dlg').close(); return }
  compute();
  const items = [['Company', r.co], ['Department', r.dept], ['Job title', r.title], ['Job status', r.type], ['Office', r.office], ['Reporting manager', r.mgr], ['Official email', r.email], ['Official phone', r.phone], ['Gender', r.gender], ['Hiring date', dstr(r.hireD)], ['Contract end', dstr(r.end)], ['Contract status', r.cStatus ? r.cStatus + (r.cDays != null ? ' · ' + dayTxt(r.cDays) : '') : ''], ['Renewal status', r.renew], ['Probation end', r.probEnd ? dstr(r.probEnd) + ' · ' + r.pStatus : ''], ...(isAdmin() ? [['Monthly gross', r.sal ? ngn(r.sal) : 'Not on file']] : []), ['Exit', r.exitD ? dstr(r.exitD) + ' · ' + (r.why || 'Reason not stated') : ''], ['Last updated', r.updatedAt ? r.updatedAt.toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + (r.updatedByEmail ? ' by ' + r.updatedByEmail : '') : '']].filter(x => x[1] !== '' && x[1] != null);
  $('#dlgBody').innerHTML = `<h2>${esc(r.name)}</h2><div>${r.active ? pill('Active', 'good') : pill('Exited', 'gray')} <span class="note">${esc(r.group)}</span></div><dl class="dl">${items.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
  <div class="dlgfoot">${canEdit() ? `<button class="btn ghost" data-act="edit" data-id="${esc(r.row)}" data-focus="exit">${r.active ? 'Record exit' : 'Edit exit'}</button>${isCT(r) ? `<button class="btn ghost" data-act="edit" data-id="${esc(r.row)}" data-focus="rev">Renew contract</button>` : ''}<button class="btn ghost" data-act="edit" data-id="${esc(r.row)}">Edit details</button>` : ''}<button class="btn" id="dlgClose">Close</button></div>`;
  $('#dlg').classList.remove('wide'); if (!$('#dlg').open) $('#dlg').showModal(); $('#dlgClose').focus();
}

/* ---------- wiring ---------- */
$('#importFile').onchange = e => { const f = e.target.files[0]; if (f) importFile(f); e.target.value = '' };
$('#chips').onclick = e => { const b = e.target.closest('[data-co]'); if (b) { S.company = b.dataset.co; render() } };
$('#tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) { S.tab = b.dataset.tab; try { history.replaceState(null, '', '#' + S.tab) } catch (_) { location.hash = S.tab } render() } };
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS[h] && allowedTab(h) && h !== S.tab && U.role) { S.tab = h; render() } });
$('#prob').onchange = e => { S.prob = Math.min(24, Math.max(1, parseInt(e.target.value) || 6)); e.target.value = S.prob; try { localStorage.setItem('hrdesk_prob', S.prob) } catch (_) { } render() };
$('#asof').onchange = e => { const v = e.target.value; if (v) { S.asof = new Date(v + 'T00:00:00Z'); render() } };
let qTimer; $('#view').addEventListener('input', e => { if (e.target.id === 'search') { S.q = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(render, 120) } });
$('#view').addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a) { const act = a.dataset.act; if (act === 'add') editForm(null); else if (act === 'import') $('#importFile').click(); else if (act === 'export') exportXlsx(); return }
  const rv = e.target.closest('[data-revoke]'); if (rv) { revoke(rv.dataset.revoke); return }
  const ui = e.target.closest('[data-uninvite]'); if (ui) { db.doc('invites/' + ui.dataset.uninvite).delete().then(() => { toast('Invite cancelled'); render() }).catch(err => toast(err.message)); return }
  const tr = e.target.closest('tr[data-row]'); if (tr) detail(tr.dataset.row)
});
$('#view').addEventListener('change', async e => {
  const s = e.target.closest('[data-role]'); if (!s) return;
  try { await db.doc('users/' + s.dataset.role).update({ role: s.value }); toast('Role changed to ' + ROLE_LABEL[s.value]) } catch (err) { toast('Could not change role: ' + err.message); render() }
});
$('#view').addEventListener('submit', async e => {
  if (e.target.id !== 'invForm') return; e.preventDefault();
  const fd = new FormData(e.target), email = lower(fd.get('email')), err = $('#invErr');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = 'Enter a valid email address.'; return }
  try { await db.doc('invites/' + email).set({ role: fd.get('role'), name: String(fd.get('name') || '').trim(), by: U.user.email, at: ts() }); toast('Invited ' + email); render() }
  catch (x) { err.textContent = 'Could not invite: ' + x.message }
});
$('#view').addEventListener('keydown', e => { const tr = e.target.closest('tr[data-row]'); if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); detail(tr.dataset.row) } });
async function revoke(uid) {
  if (!(await ask('Remove this person\'s access to HR Desk? They will no longer be able to open the records.', 'Remove access', true))) { render(); return }
  try { await db.doc('users/' + uid).delete(); toast('Access removed') } catch (e) { toast('Could not remove: ' + e.message) } render();
}
$('#dlg').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && b.dataset.act === 'edit') { editForm(b.dataset.id, b.dataset.focus); return }
  if (b && b.dataset.act === 'del') { deleteRec(b.dataset.id); return }
  if (b && b.dataset.act === 'cancel') { const id = b.dataset.id; id ? detail(id) : $('#dlg').close(); return }
  if (e.target.id === 'dlgClose' || e.target === $('#dlg')) $('#dlg').close()
});
$('#dlg').addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'ef') saveForm(e.target) });
document.addEventListener('submit', e => { if (e.target.id === 'authForm') { e.preventDefault(); submitAuth(e.target) } });
document.addEventListener('click', async e => {
  const a = e.target.closest('[data-auth]'); const so = e.target.closest('#signOut');
  if (so) { stopData(); U.role = null; await auth.signOut(); return }
  if (!a) return; e.preventDefault();
  const k = a.dataset.auth;
  if (k === 'signin' || k === 'signup' || k === 'reset') authView(k);
  else if (k === 'signout') { stopData(); U.role = null; await auth.signOut() }
  else if (k === 'claim') claimAdmin();
  else if (k === 'recheck') { await auth.currentUser.reload(); onSignedIn(auth.currentUser) }
  else if (k === 'resend') { try { await auth.currentUser.sendEmailVerification({ url: location.origin + location.pathname }); toast('Confirmation email sent') } catch (x) { toast(x.code === 'auth/too-many-requests' ? 'Please wait a minute before resending' : x.message) } }
});

/* ---------- installable app ---------- */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/claude\.ai|claudeusercontent/.test(location.hostname)) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#installBtn').hidden = false });
window.addEventListener('appinstalled', () => { $('#installBtn').hidden = true; installEvt = null; toast('HR Desk installed - find it in your apps') });
$('#installBtn').onclick = async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice } catch (_) { } installEvt = null; $('#installBtn').hidden = true };

/* ---------- start ---------- */
const now = new Date(); S.asof = utc(now.getFullYear(), now.getMonth(), now.getDate()); $('#asof').value = iso(S.asof);
try { const p = +localStorage.getItem('hrdesk_prob'); if (p) { S.prob = p; $('#prob').value = p } } catch (_) { }
if (!CFG || !CFG.apiKey || typeof firebase === 'undefined') {
  show('#start');
  $('#start').innerHTML = `<div class="drop" style="border-style:solid"><h1 style="font-size:28px">HR Desk is not connected yet</h1><p>${typeof firebase === 'undefined' ? 'The sign-in service could not load. Check your internet connection and reload.' : 'The Firebase settings have not been added to this copy of the app.'}</p></div>`;
} else {
  firebase.initializeApp(CFG); auth = firebase.auth(); db = firebase.firestore();
  auth.onAuthStateChanged(u => { if (u) onSignedIn(u); else { stopData(); U.role = null; $('#who').hidden = true; authView('signin') } });
}
}

</script>
</body>
</html>
